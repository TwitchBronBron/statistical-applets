<!DOCTYPE html>
<!--
    LOCAL RECONSTRUCTION. The original HTML5 code for this applet was never archived. This rebuild follows
    the surviving page text, whose instructions match the Central Limit Theorem applet's except for showing t
    statistics and a t curve, so it's built from the Central Limit Theorem rebuild (3_cltmean).
-->
<html>
    <head>
        <title>Distribution of the One-Sample t Statistic</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <link rel="stylesheet" href="style.css" type="text/css" media="screen">
        <link rel="stylesheet" href="../common/css/ui-lightness/jquery-ui.css" type="text/css" media="screen">
        <script src="../common/jquery.min.js" type="text/javascript"></script>
        <script src="../common/jquery-ui.min.js" type="text/javascript"></script>
        <script src="../common/jquery.ui.touch-punch.min.js"></script>
        <script src="../common/raphael-min.js"></script>
        <script src="math_script.js"></script>
        <script src="main_script.js"></script>
    </head>
    <body>
        <div id="fone">
            <div id="left_panel">
                <div class="settings">
                    <div class="label">Population:</div>
                    <div class="radio_row"><input type="radio" name="population" id="pop_exp" value="exponential" checked/> <label for="pop_exp">Exponential</label></div>
                    <div class="radio_row"><input type="radio" name="population" id="pop_unif" value="uniform"/> <label for="pop_unif">Uniform</label></div>
                    <div class="radio_row"><input type="radio" name="population" id="pop_norm" value="normal"/> <label for="pop_norm">Normal</label></div>

                    <p>
                        <label class="label" for="sample_size_slider">Sample Size (<i>n</i>):</label>
                        <input class="input" type="text" id="sample_size" disabled />
                    </p>
                    <div id="sample_size_slider"></div>
                </div>
                <p class="controlButtons">
                    <a id="generate">GENERATE</a>
                </p>
                <div class="checkbox_row">
                    <input type="checkbox" id="show_normal"/> <label for="show_normal">Show t curve</label>
                </div>
            </div>
            <div id="notepad">
            </div>
        </div>
    </body>
</html>
