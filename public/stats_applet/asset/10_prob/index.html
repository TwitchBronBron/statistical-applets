<!DOCTYPE html>
<!--
    LOCAL RECONSTRUCTION. The original HTML5 code for this applet was never archived. This rebuild follows
    the surviving page text and the Java "Probability" applet it replaced (Probability.jar, Sumanas, Inc.);
    the coin images in images/ are that applet's own. Layout, style, and libraries follow the sibling
    HTML5 applets.
-->
<html>
    <head>
        <title>Probability</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <link rel="stylesheet" href="style.css" type="text/css" media="screen">
        <script src="../common/jquery.min.js" type="text/javascript"></script>
        <script src="../common/raphael-min.js"></script>
        <script src="math_script.js"></script>
        <script src="main_script.js"></script>
    </head>
    <body>
        <div id="fone">
            <div id="left_panel">
                <div class="settings">
                    <div class="label_box">
                        <label for="prob_heads">Probability of heads:</label>
                        <input class="input_box" id="prob_heads" type="text" value="0.5"/>
                    </div>
                    <div class="label_box">
                        <label for="num_tosses">Number of tosses:</label>
                        <input class="input_box" id="num_tosses" type="text" value="10"/>
                    </div>
                </div>
                <p class="inputForm">
                    <a href="#" id="toss_button">TOSS</a>
                </p>
                <p class="inputForm">
                    <a href="#" id="reset_button">RESET</a>
                </p>
                <div class="checkbox_row">
                    <input type="checkbox" id="show_prob"/> <label for="show_prob">Show true probability</label>
                </div>
            </div>
            <div id="notepad">
                <div id="coin_strip">
                    <div id="flipper"></div>
                    <div id="coins"></div>
                </div>
            </div>
        </div>
    </body>
</html>
