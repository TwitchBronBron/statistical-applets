<!DOCTYPE html>

<html>
	
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

        <meta http-equiv="expires" content="0">
        <link rel="stylesheet" href="style.css" type="text/css" media="screen">
        <link rel="stylesheet" href="../common/css/ui-lightness/jquery-ui.css" type="text/css" media="screen">
        <link rel="stylesheet" href="../common/css/styleMain.css" type="text/css" media="screen">
        <script src="../common/jquery.min.js" type="text/javascript"></script>
        <script src="../common/jquery-ui.min.js" type="text/javascript"></script>
	    <script src="../common/jquery.ui.touch-punch.min.js"></script>

        <script src="math_script.js"></script>

    <body>
        <center>
        <table width="800">
                <td>
			        <div id="fone">
			            <div id="left_panel">
			                <div id="enter">
			                    <form action="" method="get" id="enter_form">
			                        <div class="settings">
			                            <p>
			                            <label class="label" for="conf_lvl_slider">Confidence Level (<i>C</i>):</label>
										<!input type="text" id="conf_lvl" size="2" />
			                            <input class ="input" type="text" id="conf_lvl" disabled />
										<!input class="input" type="text" size="4" />
										</p>
			                            <div id="conf_lvl_slider"></div>
			                            <p>
										<label class="label" for="sample_size">Sample Size (<i>n</i>):</label>                            
			                            <input class ="input" type="text" id="sample_size" disabled>
										</p>
			                            <div id="sample_size_slider"></div>
			                        </div>
			                        <p class="controlButtons">
			                            <a id="sample_1" >SAMPLE</a>
			                        </p>
			                        <p class="controlButtons">
			                            <a id="sample_more" >SAMPLE 25</a>
			                        </p>
									<p>
			                        <div class="stats">

										<label class="label" for="percent">Percent hit:</label> <input class ="input" id="percent" type="text" disabled>
									</div>
									</p>
			                        <p class="controlButtons">
			                            <a id="reset" >RESET</a>
			                        </p>
			                    </form>
			                </div>
			            </div>
			            <div id='population_label'>Population Distribution</div>
			            <div id='sampling_label'>Sampling Distribution</div>
			            <div id='mu_label'><em>&mu;</em></div>
			            <div id="notepad"> 
			            </div>
			        </div>

            </tr>
        </table>
