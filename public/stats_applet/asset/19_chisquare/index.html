<html>
    <head>
        <title>Chi-square Goodness of Fit Test</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <link rel="stylesheet" href="style.css" type="text/css" media="screen">
        <link rel="stylesheet" href="../common/css/ui-lightness/jquery-ui.css" type="text/css" media="screen">
        <script src="../common/jquery.min.js" type="text/javascript"></script>
        <script src="../common/jquery-ui.min.js" type="text/javascript"></script>
        <script src="../common/jquery.ui.touch-punch.min.js"></script>
        <script src="../common/raphael-min.js"></script>
        <script src="math_script.js"></script>
        <script src="main_script.js"></script>
    </head>
    <body>
        <div id="fone">
            <div id="left_panel">
                <div class="settings">
                    <p>
                        <label class="label" for="bag_count_slider">Bag Count (<i>n</i>):</label>
                        <input class="input" type="text" id="bag_count" disabled />
                    </p>
                    <div id="bag_count_slider"></div>
                    <p>
                        <label class="label" for="alpha_slider">Significance level (&alpha;):</label>
                        <input class="input" type="text" id="alpha" disabled />
                    </p>
                    <div id="alpha_slider"></div>
                </div>
                <p class="controlButtons"><a id="pour">POUR NEW BAG</a></p>
                <p class="controlButtons"><a id="show_hopper">SHOW HOPPER VALUES</a></p>
                <p class="controlButtons"><a id="new_hopper">NEW HOPPER</a></p>
            </div>
            <div id="notepad">
                <div id="results">
                    <table id="table">
                        <thead><tr><th>Color</th><th>Observed</th><th>Expected</th><th>Hopper</th></tr></thead>
                        <tbody></tbody>
                    </table>
                    <div id="test"></div>
                    <div id="tally"></div>
                </div>
            </div>
        </div>
    </body>
