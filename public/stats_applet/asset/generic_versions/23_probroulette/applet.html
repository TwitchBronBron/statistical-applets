<html>
    <head>
        <title>Probability 2 (the Roulette Wheel)</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <link rel="stylesheet" href="style.css" type="text/css" media="screen">

    <body>
        <div id="fone">
            <div id="left_panel">
                <div class="settings">

                        <label for="event">Event of interest:</label>

                        <input class="input_box" id="num_spins" type="text" value="5"/>

                </div>
                <p class="inputForm"><a href="#" id="spin_button">SPIN</a></p>

                <div class="checkbox_row">
                    <input type="checkbox" id="show_prob"/> <label for="show_prob">Show true probability</label>

            </div>
            <div id="notepad">
                <div id="summary"></div>
            </div>
        </div>
