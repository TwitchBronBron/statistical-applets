<!DOCTYPE html>
<!--

    the surviving page text and quiz. Layout and style follow the sibling HTML5 applets (via the Central
    Limit Theorem rebuild, 3_cltmean).

<html>
    <head>
        <title>Sampling Distribution of a Proportion</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <link rel="stylesheet" href="style.css" type="text/css" media="screen">
        <script src="../../common/jquery.min.js" type="text/javascript"></script>
        <script src="../../common/raphael-min.js"></script>
        <script src="math_script.js"></script>
        <script src="main_script.js"></script>
    </head>
    <body>
        <div id="fone">
            <div id="left_panel">
                <div class="settings">
                    <div class="label_box">
                        <label for="p">Population proportion <i>p</i>:</label>
                        <input type="text" id="p" value="0.5"/>
                    </div>
                    <div class="label_box">
                        <label for="n">Sample size <i>n</i> (20 to 2000):</label>
                        <input type="text" id="n" value="100"/>
                    </div>
                </div>
                <p class="controlButtons">
                    <a id="generate_one">GENERATE ONE SAMPLE</a>
                    <a id="generate_many">GENERATE SAMPLES</a>
                </p>
                <div class="checkbox_row">
                    <input type="checkbox" id="show_normal"/> <label for="show_normal">Show Normal Curve</label>
                </div>
            </div>
            <div id="notepad">
                <div id="stats"></div>
            </div>
        </div>
    </body>
</html>
