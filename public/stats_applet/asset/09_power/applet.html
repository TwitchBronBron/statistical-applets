<!DOCTYPE html>
<!--
    LOCAL RECONSTRUCTION. The original HTML5 code for this applet was never archived. This rebuild
    follows the 2005 Java "Power" applet it was ported from (power.jar, Sumanas, Inc.) for behavior,
    and the sibling HTML5 applet 14_signif for layout, style, and libraries.
-->
<html>
    <head>
        <title>Statistical Power</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <link rel="stylesheet" href="style.css" type="text/css" media="screen">
        <script src="../common/jquery.min.js" type="text/javascript"></script>
        <script src="../common/raphael-min.js"></script>
        <script src="math_script.js"></script>
        <script src="main_script.js"></script>
    </head>
    <body>
        <div id="fone">
            <div id="left_panel">
                <div id="enter">
                    <form action="" method="get" id="enter_form">
                        <div class="settings">

                            <table id='hypotheses_table' border="0" cellspacing="0" cellpadding="0">
                            <tr>
                                <td style='vertical-align:middle'>H<sub>0</sub>:</td>
                                <td><label for="h0">µ = </label><input class='input_box' id="h0" type="text"/></td>
                            </tr>

                            <tr>
                                <td style='padding-right:10px;'><label>H<sub>a</sub>:</label></td>
                                <td>
                                    <div class="ha_box">
                                        <input name="ha" id="ha1" type="radio" checked/>
                                        <label for="ha1" id="lha1">µ ></label>
                                    </div>
                                    <div class="ha_box">
                                        <input name="ha" id="ha2" type="radio"/>
                                        <label for="ha2" id="lha2">µ <</label>
                                    </div>
                                    <div class="ha_box">
                                        <input name="ha" id="ha3" type="radio"/>
                                        <label for="ha3" id="lha3"> µ ≠ </label>
                                    </div>
                                </td>
                            </tr>
                            </table>

                            <div class="label_box">
                                <label for="alpha">α = </label><input class='input_box' id="alpha" type="text"/>
                            </div>
                            <div class="label_box">
                                <label for="sigma">σ = </label><input class='input_box' id="sigma" type="text"/>
                            </div>
                            <div class="label_box">
                                <label for="n"><i>n</i> = </label><input class='input_box' id="n" type="text"/>
                            </div>
                            <div class="label_box">
                                <label for="alt_mean">alt. µ = </label><input class='input_box' id="alt_mean" type="text"/>
                            </div>
                        </div>
                        <p class="inputForm" style='margin-left:12px'>
                            <a href="#" id="u_button" >UPDATE</a>
                        </p>
                        <p class="inputForm" style='margin-left:12px'>
                            <a href="#" id="c_button" >RESET</a>
                        </p>
                    </form>
                </div>
            </div>
            <div id="notepad">
            </div>
        </div>
    </body>
</html>
